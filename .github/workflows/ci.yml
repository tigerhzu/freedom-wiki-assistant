name: Verify Wiki Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_WIKI_ORIGIN: https://wiki.example.invalid
          VITE_CUSTOMER_BASE_PATH: /docs/clients
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-studio-unconfigured
          path: dist/
