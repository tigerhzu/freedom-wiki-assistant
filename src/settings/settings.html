<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freedom Wiki Assistant 設定</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
        color: #1f2937;
        background: #f4f6fb;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 40px 20px 64px;
        background:
          radial-gradient(circle at 15% 8%, rgba(221, 229, 255, 0.7), transparent 32%),
          radial-gradient(circle at 92% 18%, rgba(232, 225, 255, 0.65), transparent 30%),
          #f4f6fb;
        font-size: 14px;
      }

      .settings-shell {
        display: grid;
        width: min(820px, 100%);
        margin: 0 auto;
        gap: 22px;
      }

      .settings-card {
        min-width: 0;
        margin: 0;
        padding: 26px 26px 28px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(209, 217, 235, 0.86);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(67, 81, 120, 0.08);
      }

      .settings-card-title {
        display: flex;
        width: auto;
        max-width: 100%;
        margin-bottom: 22px;
        padding: 0;
        align-items: baseline;
        gap: 8px;
        color: #172033;
        font-size: 17px;
        font-weight: 700;
      }

      .settings-card-title .english {
        color: #7a8498;
        font-size: 12px;
        font-weight: 500;
      }

      .section-kicker {
        margin-bottom: 9px;
        color: #263247;
        font-size: 14px;
        font-weight: 700;
      }

      .hint,
      .section-help {
        margin: 5px 0 0;
        color: #7a8498;
        font-size: 12px;
        line-height: 1.6;
      }

      #status {
        min-height: 0;
        margin: -12px 0 -4px;
        color: #16803c;
        font-size: 13px;
        text-align: center;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        min-height: 40px;
        padding: 8px 14px;
        color: #344054;
        background: #ffffff;
        border: 1px solid #cbd5e5;
        border-radius: 10px;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }

      button:hover {
        background: #f8faff;
        border-color: #9eb2d5;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(66, 133, 244, 0.2);
        outline-offset: 1px;
      }

      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        min-height: 40px;
        padding: 8px 11px;
        color: #1f2937;
        background: #ffffff;
        border: 1px solid #cbd5e5;
        border-radius: 10px;
      }

      .appearance-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .appearance-controls { min-width: 0; }

      #sidebar-color-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
        margin: 15px 0 20px;
      }

      .sidebar-color-swatch {
        width: 30px;
        height: 30px;
        min-height: 30px;
        padding: 0;
        background: linear-gradient(145deg, var(--sw) 0%, var(--sw-end, var(--sw)) 100%);
        border: 2px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .sidebar-color-swatch:hover { transform: translateY(-2px) scale(1.06); }

      .sidebar-color-swatch.active {
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px var(--sw);
      }

      .sidebar-color-field {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 10px;
        margin: 11px 0;
        align-items: center;
        color: #647087;
        font-size: 12px;
      }

      .sidebar-color-controls {
        display: flex;
        min-width: 0;
        gap: 8px;
        align-items: center;
      }

      .sidebar-color-controls input[type="color"] {
        width: 42px;
        height: 40px;
        flex: none;
        padding: 3px;
        background: #ffffff;
        border: 1px solid #cbd5e5;
        border-radius: 10px;
        cursor: pointer;
      }

      .sidebar-color-controls input[type="text"] { min-width: 0; }

      #resetSidebarColor {
        margin-top: 8px;
        color: #526078;
        font-size: 12px;
      }

      .preview-label {
        margin-bottom: 9px;
        color: #263247;
        font-size: 14px;
        font-weight: 700;
      }

      .sidebar-preview {
        overflow: hidden;
        min-height: 196px;
        color: var(--preview-text, #ffffff);
        background-color: #1976d2;
        background-image: var(--preview-gradient, linear-gradient(155deg, #1976d2 0%, #1561ac 100%));
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 16px;
        box-shadow: 0 14px 26px rgba(50, 65, 110, 0.2);
      }

      .sidebar-preview-head {
        display: flex;
        gap: 8px;
        padding: 12px;
        background-color: #1565c0;
        background-image: var(--preview-header-gradient, linear-gradient(115deg, #1565c0 0%, #125394 100%));
      }

      .sidebar-preview button {
        min-height: 0;
        margin: 0;
        padding: 8px 9px;
        color: inherit;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, box-shadow 140ms ease, filter 140ms ease, transform 140ms ease;
      }

      .sidebar-preview button:hover {
        filter: brightness(1.08);
        border-color: rgba(255, 255, 255, 0.28);
        box-shadow: 0 4px 12px rgba(31, 35, 40, 0.18);
        transform: translateY(-1px);
      }

      .sidebar-preview button:active { transform: translateY(0) scale(0.98); }

      .sidebar-preview button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.95);
        outline-offset: 2px;
      }

      .sidebar-preview-head button {
        flex: 1;
        background: var(--preview-button, #1976d2);
        border-radius: 7px;
        font-weight: 700;
      }

      .sidebar-preview-head button:first-child {
        flex: 0 0 32px;
        text-align: center;
      }

      .sidebar-preview-items {
        display: grid;
        gap: 3px;
        padding: 11px 9px;
      }

      .sidebar-preview-item {
        display: flex;
        width: 100%;
        min-height: 0;
        padding: 9px 10px;
        align-items: center;
        gap: 10px;
        color: inherit;
        background: transparent;
        border-radius: 8px;
        text-align: left;
        font-size: 12px;
        font-weight: 600;
      }

      .sidebar-preview-item:hover {
        background: rgba(255, 255, 255, 0.26);
        transform: translateX(3px);
      }

      .sidebar-preview-item:active { transform: translateX(3px) scale(0.985); }

      .sidebar-preview-item.active {
        background: rgba(255, 255, 255, 0.17);
      }

      .sidebar-preview-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-preview-icon {
        width: 14px;
        height: 14px;
        flex: none;
        border: 2px solid currentColor;
        border-radius: 4px;
        opacity: 0.9;
      }

      /* Keep the preview controls visual-only: they demonstrate hover states
         without navigating away from the settings page. */
      .sidebar-preview button {
        -webkit-tap-highlight-color: transparent;
      }

      .option-list {
        display: grid;
        gap: 9px;
        margin-top: 14px;
      }

      .option-row {
        display: flex;
        min-height: 42px;
        padding: 9px 12px;
        align-items: center;
        gap: 10px;
        color: #344054;
        background: #f8faff;
        border: 1px solid #e3e9f3;
        border-radius: 10px;
      }

      .option-row:has(input:checked) {
        color: #1f5fbe;
        background: #eef5ff;
        border-color: #9dc2f5;
      }

      .option-row input { accent-color: #2f7be5; }

      .form-grid {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }

      .form-row {
        display: grid;
        grid-template-columns: minmax(190px, 0.9fr) minmax(0, 1.2fr);
        gap: 18px;
        align-items: center;
        color: #4c5870;
      }

      .form-row > span:first-child { line-height: 1.45; }

      .api-key-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .api-key-controls button { min-width: 62px; }

      .backup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 4px;
      }

      .backup-actions button { flex: 1 1 190px; }

      .backup-actions button:first-child {
        color: #ffffff;
        background: #2f7be5;
        border-color: #2f7be5;
      }

      .backup-actions button:first-child:hover { background: #246ac9; }

      @media (max-width: 700px) {
        body { padding: 24px 12px 40px; }
        .settings-card { padding: 20px 18px 22px; border-radius: 15px; }
        .appearance-grid { grid-template-columns: 1fr; gap: 22px; }
        .sidebar-preview { min-height: 174px; }
        .form-row { grid-template-columns: 1fr; gap: 7px; }
      }

      @media (max-width: 430px) {
        .sidebar-color-field { grid-template-columns: 1fr; gap: 6px; }
        .sidebar-color-controls input[type="text"] { flex: 1; }
        .api-key-controls { grid-template-columns: 1fr; }
        .api-key-controls button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="settings-shell">
      <p id="status" role="status" aria-live="polite"></p>

      <section class="settings-card">
        <div class="settings-card-title">外觀 <span class="english">Appearance</span></div>
        <div class="appearance-grid">
          <div class="appearance-controls">
            <div class="section-kicker">Accent Color</div>
            <p class="section-help">選擇左側導覽列顏色，變更會即時套用。</p>
            <div id="sidebar-color-presets" aria-label="常用顏色"></div>
            <label class="sidebar-color-field">
              <span>主色</span>
              <span class="sidebar-color-controls">
                <input type="color" id="sidebarColorPicker" aria-label="選擇左側導覽列主色" />
                <input type="text" id="sidebarColor" placeholder="#1976d2" aria-label="左側導覽列主色 HEX" />
              </span>
            </label>
            <label class="sidebar-color-field">
              <span>漸層色</span>
              <span class="sidebar-color-controls">
                <input type="color" id="sidebarGradientColorPicker" aria-label="選擇左側導覽列漸層色" />
                <input type="text" id="sidebarGradientColor" placeholder="#1561ac" aria-label="左側導覽列漸層色 HEX" />
              </span>
            </label>
            <button id="resetSidebarColor" type="button">恢復 Wiki 原始顏色</button>
          </div>
          <div>
            <div class="preview-label">即時預覽 <span class="english">Preview</span></div>
            <div id="sidebarPreview" class="sidebar-preview" aria-label="左側導覽列顏色預覽">
              <div class="sidebar-preview-head">
                <button type="button" aria-label="預覽首頁">⌂</button>
                <button type="button">Browse</button>
              </div>
              <div class="sidebar-preview-items">
                <button type="button" class="sidebar-preview-item active"><i class="sidebar-preview-icon"></i><span>Home</span></button>
                <button type="button" class="sidebar-preview-item"><i class="sidebar-preview-icon"></i><span>Engineering</span></button>
                <button type="button" class="sidebar-preview-item"><i class="sidebar-preview-icon"></i><span>Customers</span></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-card">
        <div class="settings-card-title">圖片 <span class="english">Images</span></div>
        <div class="section-kicker">上傳資料夾判斷方式</div>
        <div class="option-list">
          <label class="option-row"><input type="radio" name="folderStrategy" value="currentPath" id="folderStrategyCurrentPath" /><span>自動使用目前文章路徑（預設）</span></label>
          <label class="option-row"><input type="radio" name="folderStrategy" value="parentFolder" id="folderStrategyParentFolder" /><span>使用目前文章的父資料夾</span></label>
          <label class="option-row"><input type="radio" name="folderStrategy" value="manual" id="folderStrategyManual" /><span>每次手動選擇</span></label>
        </div>
        <div class="form-grid">
          <label class="form-row"><span>找不到目前文章路徑時的預設資料夾</span><input type="text" id="defaultImageFolder" placeholder="/docs/clients/example-client" /></label>
          <label class="form-row"><span>圖片 Markdown 格式</span><input type="text" id="imageMarkdownFormat" /></label>
        </div>
      </section>

      <section class="settings-card">
        <div class="settings-card-title">AI 排版 <span class="english">Azure OpenAI</span></div>
        <div class="form-grid">
          <label class="form-row"><span>Azure Endpoint</span><input type="text" id="azureEndpoint" placeholder="https://your-resource.openai.azure.com" autocomplete="off" spellcheck="false" /></label>
          <label class="form-row"><span>Azure Deployment Name</span><input type="text" id="azureDeployment" placeholder="例如：gpt-4.1 或自訂部署名稱" autocomplete="off" spellcheck="false" /></label>
          <label class="form-row"><span>Azure API Version</span><input type="text" id="azureApiVersion" placeholder="2024-12-01-preview" autocomplete="off" spellcheck="false" /></label>
          <label class="form-row"><span>Azure OpenAI API Key</span><span class="api-key-controls"><input type="password" id="azureApiKey" placeholder="貼上 Azure OpenAI API Key" autocomplete="off" spellcheck="false" /><button id="toggleAzureApiKey" type="button">顯示</button></span></label>
        </div>
      </section>

      <section class="settings-card">
        <div class="settings-card-title">完整設定檔 <span class="english">Backup</span></div>
        <div class="backup-actions">
          <button id="exportFullSettings" type="button">匯出全部設定（含 API Key）</button>
          <button id="exportSettingsWithoutApiKey" type="button">匯出所有設定（不含 API Key）</button>
          <button id="importFullSettings" type="button">匯入全部設定</button>
        </div>
        <p class="hint">包含外觀、客戶名單、資料夾、模板、圖片與 AI 設定；匯入會完整取代目前設定。含 API Key 的檔案請妥善保管。</p>
      </section>
    </main>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
