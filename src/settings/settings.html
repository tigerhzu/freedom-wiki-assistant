<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>設定 · Wiki</title><link rel="stylesheet" href="./settings.css" /><link rel="stylesheet" href="./paper.css" /></head>
<body class="settings-paper">
<a class="paper-skip" href="#settings-main">跳至設定內容</a>
<div class="settings-app">
<aside class="settings-rail" aria-label="設定導覽">
<div class="paper-brand"><span class="paper-brand-name">Wiki</span></div>
<nav class="settings-nav" role="tablist" aria-label="設定分類" aria-orientation="vertical">
<button id="tab-appearance" type="button" role="tab" aria-selected="true" aria-controls="pane-appearance" data-pane="appearance"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></span>外觀與 Pet</button>
<button id="tab-editor" type="button" role="tab" aria-selected="false" aria-controls="pane-editor" data-pane="editor" tabindex="-1"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M5 19l4-1L20 7a2 2 0 0 0-3-3L6 15l-1 4Z"/></svg></span>編輯與圖片</button>
<button id="tab-ai" type="button" role="tab" aria-selected="false" aria-controls="pane-ai" data-pane="ai" tabindex="-1"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg></span>AI 服務</button>
<button id="tab-backup" type="button" role="tab" aria-selected="false" aria-controls="pane-backup" data-pane="backup" tabindex="-1"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>資料備份</button>
</nav>
</aside>
<main id="settings-main" class="settings-main" tabindex="-1">
<header class="paper-masthead">
<h1>設定</h1>
<figure class="paper-portrait"><img src="../icons/wiki_logo_512.png" width="512" height="512" alt="" /></figure>
</header>
<p id="status" class="visually-hidden" role="status" aria-live="polite" data-state="saved"></p>
<section id="pane-appearance" class="settings-pane" role="tabpanel" aria-labelledby="tab-appearance" tabindex="0">
<section class="settings-card pet-settings"><div class="card-heading"><h2>顯示 Pet</h2></div><label class="toggle-row pet-toggle"><span class="visually-hidden">顯示 Pet</span><input type="checkbox" id="showPet" role="switch" aria-label="顯示 Pet" /></label></section>
<section class="settings-card">
<div class="card-heading"><h2>導覽列配色</h2></div>
<div class="appearance-grid"><div class="appearance-controls"><div id="sidebar-color-presets" aria-label="常用顏色"></div>
<label class="sidebar-color-field"><span>主色</span><span class="sidebar-color-controls"><input type="color" id="sidebarColorPicker" aria-label="選擇導覽列主色" /><input type="text" id="sidebarColor" placeholder="#1976d2" aria-label="導覽列主色 HEX" spellcheck="false" /></span></label>
<label class="sidebar-color-field"><span>漸層色</span><span class="sidebar-color-controls"><input type="color" id="sidebarGradientColorPicker" aria-label="選擇導覽列漸層色" /><input type="text" id="sidebarGradientColor" placeholder="#1561ac" aria-label="導覽列漸層色 HEX" spellcheck="false" /></span></label>
<button id="resetSidebarColor" type="button" class="text-button">恢復 Wiki 原始配色</button>
</div><div class="preview-wrap"><div id="sidebarPreview" class="sidebar-preview" aria-label="導覽列顏色預覽"><div class="sidebar-preview-head"><span class="preview-monogram">W</span><span>Freedom Wiki</span></div><div class="sidebar-preview-items"><button type="button" class="sidebar-preview-item active"><span aria-hidden="true">⌂</span><span>首頁</span></button><button type="button" class="sidebar-preview-item"><span aria-hidden="true">▤</span><span>工程文件</span></button><button type="button" class="sidebar-preview-item"><span aria-hidden="true">▦</span><span>客戶知識庫</span></button><button type="button" class="sidebar-preview-item"><span aria-hidden="true">▧</span><span>工作手冊</span></button></div><div class="preview-caption">Freedom Systems Wiki</div></div></div></div>
</section>
</section>
<section id="pane-editor" class="settings-pane" role="tabpanel" aria-labelledby="tab-editor" tabindex="0" hidden>
<section class="settings-card"><div class="card-heading"><h2>編輯習慣</h2></div><div class="toggle-list"><label class="toggle-row"><span><strong>文字格式工具</strong><small>選取文字後按右鍵。</small></span><input type="checkbox" id="enableFormattingMenu" role="switch" /></label><label class="toggle-row"><span><strong>拖曳圖片上傳</strong></span><input type="checkbox" id="enableImageDrop" role="switch" /></label><label class="toggle-row"><span><strong>貼上剪貼簿圖片</strong></span><input type="checkbox" id="enableClipboardImage" role="switch" /></label></div></section>
<section class="settings-card"><div class="card-heading"><h2>圖片儲存位置</h2></div><div class="option-list"><label class="option-row"><input type="radio" name="folderStrategy" value="currentPath" id="folderStrategyCurrentPath" /><span><strong>跟著目前文章</strong><small>每篇文章各自存放。<span class="inline-tag">建議</span></small></span></label><label class="option-row"><input type="radio" name="folderStrategy" value="parentFolder" id="folderStrategyParentFolder" /><span><strong>放在上一層資料夾</strong><small>同一主題共用圖片。</small></span></label><label class="option-row"><input type="radio" name="folderStrategy" value="manual" id="folderStrategyManual" /><span><strong>每次自行選擇</strong></span></label></div></section>
</section>
<section id="pane-ai" class="settings-pane" role="tabpanel" aria-labelledby="tab-ai" tabindex="0" hidden>
<section class="settings-card"><div class="provider-choice" role="radiogroup" aria-label="AI 服務"><label class="option-row"><input type="radio" name="aiProvider" value="ornith" id="aiProviderOrnith" /><span><strong>Local Ornith</strong></span></label><label class="option-row"><input type="radio" name="aiProvider" value="azure" id="aiProviderAzure" /><span><strong>Azure OpenAI</strong></span></label></div><p id="providerLockStatus" class="provider-lock-status" role="status" aria-live="polite"></p>
<fieldset id="ornithSettings" class="provider-panel"><legend>Local Ornith</legend><label class="form-row"><span>服務網址</span><input type="text" id="ornithBaseUrl" placeholder="https://ornith.example.invalid/v1" autocomplete="off" spellcheck="false" /></label><label class="form-row"><span>模型</span><input type="text" id="ornithModel" placeholder="Ornith-1.5-35B-A3B" autocomplete="off" spellcheck="false" /></label><label class="form-row"><span>API 金鑰</span><span class="api-key-controls"><input type="password" id="ornithApiKey" placeholder="貼上 Ornith API Key" autocomplete="new-password" spellcheck="false" /><button id="toggleOrnithApiKey" type="button" aria-label="顯示或隱藏 Ornith API 金鑰">顯示</button></span></label><button id="removeOrnithSettings" class="provider-remove" type="button">移除 Ornith 設定</button></fieldset>
<fieldset id="azureSettings" class="provider-panel"><legend>Azure OpenAI</legend><label class="form-row"><span>服務端點</span><input type="text" id="azureEndpoint" placeholder="https://your-resource.openai.azure.com" autocomplete="off" spellcheck="false" /></label><label class="form-row"><span>部署名稱</span><input type="text" id="azureDeployment" placeholder="例如 gpt-4.1" autocomplete="off" spellcheck="false" /></label><label class="form-row"><span>API 版本</span><input type="text" id="azureApiVersion" placeholder="2024-12-01-preview" autocomplete="off" spellcheck="false" /></label><label class="form-row"><span>API 金鑰</span><span class="api-key-controls"><input type="password" id="azureApiKey" placeholder="貼上 Azure OpenAI API Key" autocomplete="new-password" spellcheck="false" /><button id="toggleAzureApiKey" type="button" aria-label="顯示或隱藏 Azure API 金鑰">顯示</button></span></label><button id="removeAzureSettings" class="provider-remove" type="button">移除 Azure 設定</button></fieldset>
</section>
</section>
<section id="pane-backup" class="settings-pane" role="tabpanel" aria-labelledby="tab-backup" tabindex="0" hidden>
<section class="settings-card backup-card">
<div class="backup-action">
<span class="backup-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 19h14" /></svg></span>
<div class="backup-action-copy"><h2>匯出備份</h2><span>不含 API 金鑰</span></div>
<button id="exportSettingsWithoutApiKey" type="button" class="primary-button backup-action-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 19h14" /></svg>下載備份檔</button>
</div>
<details class="advanced-backup"><summary><span>進階備份</span><small>包含 API 金鑰</small></summary><div class="advanced-backup-content"><button id="exportFullSettings" type="button">匯出完整備份</button></div></details>
</section>
<section class="settings-card backup-card">
<div class="backup-action">
<span class="backup-symbol backup-symbol-restore" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20V9m-4 4 4-4 4 4M5 5h14" /></svg></span>
<div class="backup-action-copy"><h2>還原備份</h2></div>
<button id="importFullSettings" type="button" class="backup-action-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9m-4 4 4-4 4 4M5 5h14" /></svg>選擇備份檔</button>
</div>
</section>
</section>
</main>
</div>
<dialog id="settingsConfirm" aria-labelledby="confirmTitle" aria-describedby="confirmDescription"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmDescription"></p><div class="confirm-actions"><button value="cancel" autofocus>取消</button><button id="confirmProceed" value="confirm" class="primary-button">繼續</button></div></form></dialog>
<script type="module" src="./settings.ts"></script>
</body>
</html>
